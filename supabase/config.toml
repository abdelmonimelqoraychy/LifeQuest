# Local AUTH-2 proof only; no hosted project is linked.
project_id = "lifequest-auth2"
[api]
enabled = true
port = 54321
schemas = ["public", "auth2_proof"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.pooler]
enabled = false
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enable_signup = true
# Fictitious local security accounts only; production must require confirmation.
enable_confirmations = false
double_confirm_changes = true
[edge_runtime]
enabled = false
[analytics]
enabled = false